<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Adaptive Geometric Compression - Vision Pro</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #07080c;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 100;
    }
    .hud-left {
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
    }
    .hud-title {
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .hud-sep {
      color: #64748b;
    }
    .hud-status {
      color: #94a3b8;
    }
    .hud-right {
      pointer-events: auto;
    }
    .btn-xr {
      display: none;
      min-width: 48px;
      min-height: 48px;
      padding: 12px 24px;
      background: #2563eb;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-xr:hover {
      background: #1d4ed8;
    }
    .btn-xr:active {
      transform: scale(0.98);
    }
    #qr-card {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
      pointer-events: auto;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      max-width: 272px;
    }
    .qr-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .qr-header {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }
    .qr-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .qr-close:hover {
      color: #fff;
    }
    #qr-canvas {
      width: 240px;
      height: 240px;
      border-radius: 8px;
      background: #ffffff;
    }
    .qr-text {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
      text-align: center;
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="./lib/agc_decoder.js"></script>
  <script type="module" src="./lib/agc_viewer.js"></script>
</head>
<body>
  <agc-viewer id="view" src="./train_balanced.agc" up="z" max-points="80000" auto-rotate background="#07080c" style="position:fixed;inset:0;width:100%;height:100%;"></agc-viewer>

  <div class="hud">
    <div class="hud-left">
      <span class="hud-title">AGC stream</span>
      <span class="hud-sep">·</span>
      <span id="status" class="hud-status">Streaming...</span>
    </div>
    <div class="hud-right">
      <button id="btn-xr" class="btn-xr">Enter Immersive</button>
    </div>
  </div>

  <div id="qr-card">
    <div class="qr-top">
      <span class="qr-header">Vision Pro Safari Stream</span>
      <button id="qr-close" class="qr-close" title="Dismiss">✕</button>
    </div>
    <canvas id="qr-canvas" width="240" height="240"></canvas>
    <div id="qr-text" class="qr-text"></div>
  </div>

  <script>
    (async function() {
      const viewer = document.getElementById('view');
      const statusEl = document.getElementById('status');
      const btnXr = document.getElementById('btn-xr');
      const qrCard = document.getElementById('qr-card');
      const qrClose = document.getElementById('qr-close');
      const qrCanvas = document.getElementById('qr-canvas');
      const qrText = document.getElementById('qr-text');

      // Query ?src=: if present and valid, use it
      const urlParams = new URLSearchParams(window.location.search);
      const customSrc = urlParams.get('src');
      if (customSrc && !customSrc.startsWith('javascript:')) {
        viewer.setAttribute('src', customSrc);
      }

      viewer.addEventListener('load', () => {
        statusEl.textContent = 'Pinch to orbit · two-finger zoom';
      });

      viewer.addEventListener('error', () => {
        statusEl.textContent = 'Failed to load AGC stream';
      });

      // Check WebXR immersive-vr support
      try {
        if (window.isSecureContext && navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')) {
          btnXr.style.display = 'inline-block';
          btnXr.addEventListener('click', async () => {
            try {
              await viewer.enterImmersive();
            } catch (err) {
              statusEl.textContent = (err && err.message) ? err.message : 'WebXR immersive failed';
            }
          });
        }
      } catch (err) {
        console.warn('WebXR check error:', err);
      }

      // QR card: show on desktop/laptop displays so users can scan directly with Vision Pro camera
      if (typeof QRCode !== 'undefined' && qrCanvas) {
        const isVisionOrMobile = /Mobile|Vision|Oculus|Quest/i.test(navigator.userAgent);
        if (!isVisionOrMobile && window.innerWidth >= 600) {
          qrCard.style.display = 'flex';
          const targetUrl = window.location.href;
          qrText.textContent = 'Scan with Vision Pro to open: ' + targetUrl;
          QRCode.toCanvas(qrCanvas, targetUrl, { width: 240, margin: 1 }, (err) => {
            if (err) console.error('QRCode generation failed:', err);
          });
        }
      }

      if (qrClose) {
        qrClose.addEventListener('click', () => {
          qrCard.style.display = 'none';
        });
      }
    })();
  </script>
</body>
</html>
